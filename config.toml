# GOKS RestfulAPI 配置文件
# 此文件与 exe 放在同一目录下，修改后可在界面中热重载生效

[mysql]
# 数据库连接地址
host     = "192.168.7.229"
# 数据库端口
port     = 3306
# 数据库名称
dbname   = "sy"
# 用户名
user     = "root"
# 密码
password = "123456"

[api]
# FastAPI 服务绑定 IP（0.0.0.0 表示监听所有网卡）
host = "0.0.0.0"
# FastAPI 服务监听端口
port = 8004
# 本机对外 IP（SCADA 回调用）
my_ip = "192.168.7.253"

[scada]
# SCADA REST 接口根地址
base_url = "http://192.168.7.229:9433/api/v1"
# SCADA 登录用户名
username = "admin"
# SCADA 登录密码（MD5）
password = "48D29E9C2707D3966C779A72A7BA06E1"

[batch]
# 实时队列容量（满时入队阻塞等待）
queue_size = 100000
# 批量刷出间隔（毫秒），到期或达到 flush_batch 条时触发
flush_interval = 500
# 每批最大条数
flush_batch = 50
# 普通瞬态错误最大重试次数，超过后进入死信队列
max_retries = 3
# 死信队列内存保留条数（同时持久化到 JSONL 文件）
dead_mem_limit = 1000
# 数据库断连类错误初始退避（毫秒）
conn_retry_base_interval = 5000
# 数据库断连类错误最大退避（毫秒）
conn_retry_max_interval = 300000
# 重试状态快照落盘间隔（毫秒）
retry_state_persist_interval = 10000
